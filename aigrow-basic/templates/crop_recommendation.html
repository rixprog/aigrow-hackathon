<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI GROW - Crop Recommendation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/crop_recommendation.css') }}">
</head>
<body>
    <nav>
        <div class="logo">AI GROW</div>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/crop-recommendation" class="active">Crop Recommendation</a></li>
            <li><a href="/plant-disease">Plant Disease Detection</a></li>
            <li><a href="/weather">Weather</a></li>
            <li><a href="/chatbot">Farming Assistant</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Crop Recommendation</h1>
        <p class="subtitle">Upload your agricultural conditions to get the best crop recommendation</p>

        <div class="recommendation-container">
            <div class="input-section">
                <form id="cropForm" action="/crop-recommendation" method="POST">
                    <div class="input-group">
                        <label for="nitrogen">Nitrogen (N)</label>
                        <input type="number" name="nitrogen" id="nitrogen" 
                               placeholder="Enter Nitrogen level" 
                               min="0" max="140" step="0.1" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="phosphorus">Phosphorus (P)</label>
                        <input type="number" name="phosphorus" id="phosphorus" 
                               placeholder="Enter Phosphorus level" 
                               min="5" max="145" step="0.1" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="potassium">Potassium (K)</label>
                        <input type="number" name="potassium" id="potassium" 
                               placeholder="Enter Potassium level" 
                               min="5" max="205" step="0.1" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="temperature">Temperature (°C)</label>
                        <input type="number" step="0.1" name="temperature" id="temperature" 
                               placeholder="Enter Temperature" 
                               min="8" max="45" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="humidity">Humidity (%)</label>
                        <input type="number" step="0.1" name="humidity" id="humidity" 
                               placeholder="Enter Humidity" 
                               min="14" max="100" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="ph">pH Level</label>
                        <input type="number" step="0.1" name="ph" id="ph" 
                               placeholder="Enter pH Level" 
                               min="1" max="14" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="rainfall">Rainfall (mm)</label>
                        <input type="number" step="0.1" name="rainfall" id="rainfall" 
                               placeholder="Enter Rainfall" 
                               min="20" max="300" required>
                    </div>
                    
                    <div class="button-group">
                        <button type="submit" class="detect-btn">Get Recommendation</button>
                    </div>
                </form>
            </div>

            <div class="result-section">
                <div id="result" class="result-card">
                    <div class="result-placeholder">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-activity">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                        <p>Your crop recommendation will appear here</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/crop_recommendation.js') }}"></script>
</body>
</html>
