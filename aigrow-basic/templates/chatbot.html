<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIGrow - Farming Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="nav-logo">AI GROW</a>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="/crop-recommendation" class="nav-link">Crop Recommendation</a></li>
                    <li class="nav-item"><a href="/plant-disease" class="nav-link">Plant Disease Detection</a></li>
                    <li class="nav-item"><a href="/weather" class="nav-link">Weather</a></li>
                    <li class="nav-item"><a href="/chatbot" class="nav-link active">Farming Assistant</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="chat-section">
        <div class="chat-header">
            <h1>AIGrow Farming Assistant</h1>
            <p>Ask me about crops, diseases, techniques, or equipment</p>
        </div>
        
        <div id="chatbox"></div>
        
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type your farming question here...">
            <button onclick="sendMessage()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>
</html>
